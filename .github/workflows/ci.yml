name: TaskFlow CI

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: taskflow-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: taskflow-frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: taskflow-frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: taskflow-frontend
        run: pnpm build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend dependencies
        run: dotnet restore TaskFlowApi/TaskFlowApi.csproj

      - name: Build backend
        run: dotnet build TaskFlowApi/TaskFlowApi.csproj --configuration Release --no-restore

name: Deploy TaskFlow Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'TaskFlowApi/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build Backend
        run: dotnet build TaskFlowApi/TaskFlowApi.csproj --configuration Release

      - name: Publish Backend
        run: dotnet publish TaskFlowApi/TaskFlowApi.csproj --configuration Release --output ./publish

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-api
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download published Backend
        uses: actions/download-artifact@v4
        with:
          name: taskflow-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: taskflow-api-elham
          package: ./publish